privacy_patterns:
  # Any match drops the quote (V2) or fails the summary/note check (V6). Normalization (docs/04 §5)
  # already replaces most of these with [handle]/[email]/[phone]/[link]; these catch what slips through.
  handle: 're:(?<![\w.])@[A-Za-z0-9_.]{2,30}\b'
  email: 're:\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
  phone: 're:\(?\b\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'
  url: 're:\bhttps?://\S+|\bwww\.\S+'
  street_address: 're:\b\d{1,5}\s+(\w+\s+){1,3}(st|street|ave|avenue|rd|road|ln|lane|dr|drive|ct|court|pl|place|blvd|boulevard|way|ter|terrace|hwy|highway|tpke|turnpike|pkwy|parkway)\b\.?'
  license_plate_word: 're:\b(license\s+plate|plate\s+number|plates?|tags?)\b'
  ny_plate_format: 're:\b[A-Z]{3}[-\s]?\d{4}\b'

# ---------------------------------------------------------------------------
# 6. Query templates (planner, docs/04 §6)
#
#    {place} is filled from the gazetteer rotation; {place_station} uses the station name without
#    "station". Keyword syntax (quotes, OR) differs by platform and is [verify] for every SocialCrawl
#    search endpoint. If an endpoint does not support quotes, the planner strips them and relies on
#    the prefilter.
#    providers: which collectors use the template. "keyword" = SocialCrawl keyword_search, Google News
#    and Firecrawl search. "semantic" = Exa (natural-language queries work better there).
# ---------------------------------------------------------------------------

query_templates:
  region_wide:          # every scan (docs/04 §6 step 1)
    keyword:
      - 'homeless "Long Island"'
      - 'homeless encampment "Long Island"'
      - 'encampment "Suffolk County"'
      - 'encampment "Nassau County"'
      - '"sleeping in" LIRR station homeless'
      - '"living in" car "Nassau County"'
      - '"living in" car "Suffolk County"'
      - 'homeless camp woods "Long Island"'
      - '"sin hogar" "Long Island"'
    semantic:
      - "people sleeping at a Long Island Rail Road station"
      - "homeless encampment in the woods on Long Island, New York"
      - "someone living in a car in a parking lot in Suffolk County"
      - "someone living in a car in a parking lot in Nassau County"
      - "tents behind a shopping center on Long Island"

  place:                # rotation and hot places (docs/04 §6 steps 2-3); 1-2 templates per place per scan
    town_village_cdp:
      keyword:
        - '"{place}" homeless'
        - '"{place}" homeless camp'
        - '"{place}" "living in" car'
        - '"{place}" "sin hogar"'
      semantic:
        - "people experiencing homelessness sleeping outside in {place}, Long Island"
    lirr_station:
      keyword:
        - '"{place_station} station" homeless'
        - '"{place_station} LIRR" homeless'
        - '"{place_station} train station" sleeping'
      semantic:
        - "people sleeping at the {place_station} LIRR station"
    landmark:           # park, beach, mall, transit, library
      keyword:
        - '"{place}" homeless'
      semantic:
        - "people sleeping outside at {place} on Long Island"
