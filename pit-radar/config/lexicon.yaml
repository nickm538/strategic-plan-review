      - 're:\b(old|older|elderly|young|younger|middle-aged)\s+(man|woman|guy|lady|person|people|couple|men|women|gentleman)\b'
      - elderly
      - senior citizen
      - teen
      - teens
      - teenager
      - teenagers
      - teenage
      - kid
      - kids
      - child
      - children
      - minor
      - minors
      - baby
      - babies
      - toddler
      - infant
      - boy
      - boys
      - girl
      - girls
      - niño
      - niños
      - niña
      - niñas
      - anciano
      - anciana
      - joven
    race_ethnicity_nationality:
      - black
      - white
      - brown
      - hispanic
      - latino
      - latina
      - latinx
      - asian
      - caucasian
      - african american
      - arab
      - middle eastern
      - mexican
      - guatemalan
      - salvadoran
      - honduran
      - dominican
      - puerto rican
      - haitian
      - indian
    immigration_status:
      - immigrant
      - immigrants
      - migrant
      - migrants
      - illegal
      - illegals
      - undocumented
      - 're:(?-i:\bICE\b)'        # uppercase only, so "ice on the platform" never matches
      - deported
    gender_identity:
